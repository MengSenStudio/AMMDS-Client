# AMMDS Client 静态分析规则
#
# 依据文档 #74「代码规范」：开启 strict analyzer，减少动态类型与隐式错误。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    # 第三方兼容补丁副本，不参与本项目静态分析。
    - third_party/**
    - "**/*.g.dart"
    - lib/core/l10n/generated/**
    - web/**

linter:
  rules:
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
