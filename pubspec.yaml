name: ammds_client
description: "AMMDS 服务终端客户端：服务发现、登录认证、内容浏览与预览。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（文档 #11 指定 Riverpod）
  flutter_riverpod: ^3.0.0
  # 路由（文档 #12 指定 GoRouter）
  go_router: ^16.0.0
  # 网络层（文档 #30）
  dio: ^5.7.0
  # 摘要算法：服务端登录密码约定为 MD5 五轮摘要 + RSA 加密
  crypto: ^3.0.7
  # 应用私有目录：Android / iOS 只能通过该插件拿到可写的沙盒路径
  # （桌面端仍使用系统约定的数据目录，见 core/platform/app_paths.dart）
  path_provider: ^2.1.5
  # 国际化（文档 #7）
  intl: any
  # UI 组件库（文档 #4.3 TDesign Flutter）
  # 说明：0.2.x 通过继承 IconData 实现图标，而 Dart 3.13 起 IconData 已是
  # final class，上游版本无法编译；因此使用 third_party/ 下的兼容补丁副本
  # （仅修改图标常量构造方式，见该文件头部注释）。
  tdesign_flutter: ^0.2.8-fix.1
  tray_manager: ^0.7.0
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1
  video_player: ^2.14.0
  video_player_win: ^3.3.0
  url_launcher: ^6.3.2

  # 屏幕亮度控制（文档 #31）
  screen_brightness: ^2.1.4

# 通过依赖覆盖使用 third_party/ 下的兼容补丁副本。
# 当上游发布支持 Dart 3.13+ 的版本后，可删除本段与 third_party/ 目录。
dependency_overrides:
  tdesign_flutter:
    path: third_party/tdesign_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 组件测试用假的播放平台顶替真实解码器（见 test/media_player_test.dart）。
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
